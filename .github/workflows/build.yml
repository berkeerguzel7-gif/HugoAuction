name: Build Hugo Auction

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 21 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Projekt-ZIP entpacken
        run: |
          mkdir project
          unzip -q *.zip -d project
          echo "Projektdateien:"
          find project -maxdepth 3 -type f

      - name: Gradle Wrapper vorbereiten
        run: |
          PROJECT=$(dirname "$(find project -name build.gradle | head -1)")
          cd "$PROJECT"
          gradle wrapper --gradle-version 8.14.3
          chmod +x gradlew

      - name: Mod bauen
        run: |
          PROJECT=$(dirname "$(find project -name build.gradle | head -1)")
          cd "$PROJECT"
          ./gradlew build --refresh-dependencies --no-daemon

      - name: JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: HugoAuction-1.21.11
          path: project/**/build/libs/*.jar
